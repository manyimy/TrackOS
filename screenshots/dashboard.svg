<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 610" width="260" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif">
  <defs>
    <clipPath id="d-screen"><rect x="8" y="8" width="284" height="594" rx="38"/></clipPath>
    <linearGradient id="d-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A6BDC"/>
      <stop offset="100%" stop-color="#4FA3FF"/>
    </linearGradient>
  </defs>
  <!-- Phone shell -->
  <rect width="300" height="610" rx="44" fill="#1C1C1E"/>
  <!-- Screen bg -->
  <rect x="8" y="8" width="284" height="594" rx="38" fill="#F2F2F7" clip-path="url(#d-screen)"/>
  <!-- Dynamic Island -->
  <rect x="105" y="18" width="90" height="28" rx="14" fill="#1C1C1E"/>
  <!-- Status time -->
  <text x="28" y="38" font-size="13" font-weight="600" fill="#1C1C1E">9:41</text>

  <!-- Nav title -->
  <text x="20" y="82" font-size="26" font-weight="700" fill="#1C1C1E">Dashboard</text>
  <!-- Avatar circle -->
  <circle cx="272" cy="70" r="16" fill="#1A6BDC" fill-opacity="0.15"/>
  <text x="272" y="75" font-size="14" text-anchor="middle" fill="#1A6BDC" font-weight="600">T</text>

  <!-- Summary Card -->
  <rect x="16" y="96" width="268" height="130" rx="22" fill="url(#d-blue)"/>
  <circle cx="250" cy="110" r="52" fill="white" fill-opacity="0.06"/>
  <circle cx="268" cy="190" r="40" fill="white" fill-opacity="0.04"/>
  <text x="32" y="118" font-size="12" fill="white" fill-opacity="0.8">Good morning · April 2026</text>
  <text x="32" y="140" font-size="11" fill="white" fill-opacity="0.65">Total spent</text>
  <text x="32" y="170" font-size="30" font-weight="700" fill="white">MYR 2,840.50</text>
  <rect x="32" y="182" width="98" height="20" rx="10" fill="white" fill-opacity="0.2"/>
  <text x="81" y="196" font-size="11" fill="white" text-anchor="middle">24 expenses</text>
  <text x="148" y="196" font-size="11" fill="white" fill-opacity="0.7">↑ 12% vs last month</text>

  <!-- Period Picker -->
  <rect x="16" y="240" width="268" height="34" rx="11" fill="#E5E5EA"/>
  <rect x="18" y="242" width="86" height="30" rx="9" fill="white"/>
  <text x="61" y="261" font-size="13" font-weight="600" fill="#1C1C1E" text-anchor="middle">Week</text>
  <text x="152" y="261" font-size="13" fill="#8E8E93" text-anchor="middle">Month</text>
  <text x="243" y="261" font-size="13" fill="#8E8E93" text-anchor="middle">Year</text>

  <!-- Donut chart -->
  <circle cx="150" cy="348" r="58" fill="none" stroke="#FF9F0A" stroke-width="20" stroke-dasharray="92 292" stroke-dashoffset="0"/>
  <circle cx="150" cy="348" r="58" fill="none" stroke="#30D158" stroke-width="20" stroke-dasharray="70 292" stroke-dashoffset="-92"/>
  <circle cx="150" cy="348" r="58" fill="none" stroke="#5E5CE6" stroke-width="20" stroke-dasharray="60 292" stroke-dashoffset="-162"/>
  <circle cx="150" cy="348" r="58" fill="none" stroke="#FF375F" stroke-width="20" stroke-dasharray="70 292" stroke-dashoffset="-222"/>
  <!-- Centre text -->
  <text x="150" y="342" font-size="16" font-weight="700" fill="#1C1C1E" text-anchor="middle">MYR</text>
  <text x="150" y="360" font-size="12" fill="#8E8E93" text-anchor="middle">2,840</text>

  <!-- Legend -->
  <rect x="28" y="418" width="10" height="10" rx="5" fill="#FF9F0A"/>
  <text x="44" y="427" font-size="11" fill="#1C1C1E">Food  33%</text>
  <rect x="130" y="418" width="10" height="10" rx="5" fill="#30D158"/>
  <text x="146" y="427" font-size="11" fill="#1C1C1E">Transport  24%</text>
  <rect x="28" y="436" width="10" height="10" rx="5" fill="#5E5CE6"/>
  <text x="44" y="445" font-size="11" fill="#1C1C1E">Shopping  19%</text>
  <rect x="130" y="436" width="10" height="10" rx="5" fill="#FF375F"/>
  <text x="146" y="445" font-size="11" fill="#1C1C1E">Other  24%</text>

  <!-- Recent section -->
  <text x="20" y="468" font-size="11" font-weight="600" fill="#8E8E93">RECENT</text>

  <!-- Row 1 -->
  <rect x="16" y="475" width="268" height="46" rx="14" fill="white"/>
  <rect x="28" y="485" width="26" height="26" rx="8" fill="#FF9F0A22"/>
  <text x="41" y="502" font-size="13" text-anchor="middle">☕</text>
  <text x="64" y="496" font-size="12" font-weight="600" fill="#1C1C1E">Starbucks</text>
  <text x="64" y="510" font-size="10" fill="#8E8E93">Apr 25</text>
  <text x="272" y="502" font-size="12" font-weight="600" fill="#1C1C1E" text-anchor="end">MYR 18.00</text>

  <!-- Row 2 -->
  <rect x="16" y="524" width="268" height="46" rx="14" fill="white"/>
  <rect x="28" y="534" width="26" height="26" rx="8" fill="#30D15822"/>
  <text x="41" y="551" font-size="13" text-anchor="middle">🚗</text>
  <text x="64" y="545" font-size="12" font-weight="600" fill="#1C1C1E">Grab</text>
  <text x="64" y="559" font-size="10" fill="#8E8E93">Apr 24</text>
  <text x="272" y="551" font-size="12" font-weight="600" fill="#1C1C1E" text-anchor="end">MYR 14.00</text>

  <!-- Tab Bar -->
  <rect x="8" y="562" width="284" height="40" fill="white" fill-opacity="0.95"/>
  <line x1="8" y1="562" x2="292" y2="562" stroke="#E5E5EA" stroke-width="0.5"/>
  <text x="54" y="577" font-size="10" fill="#007AFF" text-anchor="middle">◼</text>
  <text x="54" y="589" font-size="9" fill="#007AFF" text-anchor="middle" font-weight="600">Dashboard</text>
  <text x="114" y="577" font-size="10" fill="#8E8E93" text-anchor="middle">≡</text>
  <text x="114" y="589" font-size="9" fill="#8E8E93" text-anchor="middle">Expenses</text>
  <text x="174" y="577" font-size="10" fill="#8E8E93" text-anchor="middle">⬚</text>
  <text x="174" y="589" font-size="9" fill="#8E8E93" text-anchor="middle">Scanner</text>
  <text x="234" y="577" font-size="10" fill="#8E8E93" text-anchor="middle">🔔</text>
  <text x="234" y="589" font-size="9" fill="#8E8E93" text-anchor="middle">Inbox</text>
</svg>
