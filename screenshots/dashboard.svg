<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 610" width="260" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif">
  <defs>
    <clipPath id="d-clip"><rect x="8" y="8" width="284" height="594" rx="38"/></clipPath>
    <linearGradient id="d-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Shell -->
  <rect width="300" height="610" rx="44" fill="#1C1C1E"/>
  <!-- Screen #F0F7FF -->
  <rect x="8" y="8" width="284" height="594" rx="38" fill="#F0F7FF" clip-path="url(#d-clip)"/>
  <!-- Dynamic Island -->
  <rect x="105" y="18" width="90" height="28" rx="14" fill="#1C1C1E"/>
  <text x="28" y="38" font-size="13" font-weight="600" fill="#0F172A">9:41</text>

  <!-- Greeting header -->
  <text x="20" y="76" font-size="12" fill="#64748B">Good morning</text>
  <text x="20" y="96" font-size="24" font-weight="700" fill="#0F172A">TrackOS</text>
  <!-- Avatar -->
  <circle cx="272" cy="82" r="18" fill="#DBEAFE"/>
  <text x="272" y="87" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">T</text>

  <!-- Summary card -->
  <rect x="16" y="108" width="268" height="130" rx="22" fill="url(#d-card)"/>
  <circle cx="256" cy="122" r="56" fill="white" fill-opacity="0.07"/>
  <circle cx="272" cy="202" r="44" fill="white" fill-opacity="0.05"/>
  <text x="30" y="130" font-size="12" fill="white" fill-opacity="0.8">Total Spent</text>
  <!-- Count pill -->
  <rect x="206" y="118" width="64" height="20" rx="10" fill="white" fill-opacity="0.18"/>
  <text x="238" y="132" font-size="10" fill="white" text-anchor="middle">💳 24</text>
  <text x="30" y="168" font-size="32" font-weight="700" fill="white">MYR 2,840</text>
  <text x="30" y="188" font-size="11" fill="white" fill-opacity="0.7">🍔 Most on Food</text>
  <text x="30" y="206" font-size="11" fill="white" fill-opacity="0.65">↑ 12% vs last month</text>

  <!-- Period picker #DBEAFE bg, white active -->
  <rect x="16" y="252" width="268" height="34" rx="11" fill="#DBEAFE" fill-opacity="0.5"/>
  <rect x="18" y="254" width="86" height="30" rx="9" fill="white"/>
  <text x="61" y="273" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle">Week</text>
  <text x="152" y="273" font-size="13" fill="#64748B" text-anchor="middle">Month</text>
  <text x="243" y="273" font-size="13" fill="#64748B" text-anchor="middle">Year</text>

  <!-- By Category card -->
  <rect x="16" y="298" width="268" height="148" rx="20" fill="white"/>
  <text x="30" y="320" font-size="14" font-weight="600" fill="#0F172A">By Category</text>
  <!-- Donut -->
  <circle cx="96" cy="376" r="44" fill="none" stroke="#FF9F0A" stroke-width="16" stroke-dasharray="70 207" stroke-dashoffset="0"/>
  <circle cx="96" cy="376" r="44" fill="none" stroke="#30D158" stroke-width="16" stroke-dasharray="50 207" stroke-dashoffset="-70"/>
  <circle cx="96" cy="376" r="44" fill="none" stroke="#5E5CE6" stroke-width="16" stroke-dasharray="40 207" stroke-dashoffset="-120"/>
  <circle cx="96" cy="376" r="44" fill="none" stroke="#FF375F" stroke-width="16" stroke-dasharray="47 207" stroke-dashoffset="-160"/>
  <text x="96" y="372" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">4</text>
  <text x="96" y="386" font-size="9" fill="#64748B" text-anchor="middle">categories</text>
  <!-- Legend -->
  <rect x="158" y="336" width="8" height="8" rx="2" fill="#FF9F0A"/>
  <text x="172" y="344" font-size="10" fill="#0F172A">Food</text>
  <text x="220" y="344" font-size="10" fill="#64748B">MYR 940</text>
  <rect x="158" y="354" width="8" height="8" rx="2" fill="#30D158"/>
  <text x="172" y="362" font-size="10" fill="#0F172A">Transport</text>
  <text x="220" y="362" font-size="10" fill="#64748B">MYR 681</text>
  <rect x="158" y="372" width="8" height="8" rx="2" fill="#5E5CE6"/>
  <text x="172" y="380" font-size="10" fill="#0F172A">Shopping</text>
  <text x="220" y="380" font-size="10" fill="#64748B">MYR 540</text>
  <rect x="158" y="390" width="8" height="8" rx="2" fill="#FF375F"/>
  <text x="172" y="398" font-size="10" fill="#0F172A">Other</text>
  <text x="220" y="398" font-size="10" fill="#64748B">MYR 680</text>

  <!-- Recent section -->
  <text x="20" y="462" font-size="14" font-weight="600" fill="#0F172A">Recent</text>
  <text x="268" y="462" font-size="12" fill="#2563EB" text-anchor="end">See all</text>

  <!-- Row 1 -->
  <rect x="16" y="470" width="268" height="46" rx="14" fill="white"/>
  <rect x="26" y="480" width="26" height="26" rx="8" fill="#FF9F0A1A"/>
  <text x="39" y="497" font-size="13" text-anchor="middle">☕</text>
  <text x="62" y="491" font-size="12" font-weight="600" fill="#0F172A">Starbucks</text>
  <text x="62" y="505" font-size="10" fill="#64748B">Apr 25</text>
  <text x="272" y="497" font-size="12" font-weight="600" fill="#0F172A" text-anchor="end">MYR 18.00</text>

  <!-- Row 2 -->
  <rect x="16" y="518" width="268" height="46" rx="14" fill="white"/>
  <rect x="26" y="528" width="26" height="26" rx="8" fill="#30D1581A"/>
  <text x="39" y="545" font-size="13" text-anchor="middle">🚗</text>
  <text x="62" y="539" font-size="12" font-weight="600" fill="#0F172A">Grab</text>
  <text x="62" y="553" font-size="10" fill="#64748B">Apr 24</text>
  <text x="272" y="545" font-size="12" font-weight="600" fill="#0F172A" text-anchor="end">MYR 14.00</text>

  <!-- Tab Bar -->
  <rect x="8" y="562" width="284" height="40" fill="white"/>
  <line x1="8" y1="562" x2="292" y2="562" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="54" y="577" font-size="10" fill="#2563EB" text-anchor="middle">◼</text>
  <text x="54" y="589" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="600">Dashboard</text>
  <text x="114" y="577" font-size="10" fill="#94A3B8" text-anchor="middle">≡</text>
  <text x="114" y="589" font-size="9" fill="#94A3B8" text-anchor="middle">Expenses</text>
  <text x="174" y="577" font-size="10" fill="#94A3B8" text-anchor="middle">⬚</text>
  <text x="174" y="589" font-size="9" fill="#94A3B8" text-anchor="middle">Scanner</text>
  <text x="234" y="577" font-size="10" fill="#94A3B8" text-anchor="middle">🔔</text>
  <text x="234" y="589" font-size="9" fill="#94A3B8" text-anchor="middle">Inbox</text>
</svg>
