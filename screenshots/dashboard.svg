  <text x="352" y="710" font-family="-apple-system,sans-serif" font-size="14" font-weight="500" fill="#FAFAFA" text-anchor="end">RM 22.00</text>
  <line x1="88" y1="736" x2="358" y2="736" stroke="#26262C" stroke-width="0.5"/>

  <!-- Row 5 -->
  <circle cx="60" cy="754" r="18" fill="#FF3B30" opacity="0.18"/>
  <text x="60" y="760" font-family="-apple-system,sans-serif" font-size="14" fill="#FF3B30" text-anchor="middle">⚡</text>
  <text x="92" y="748" font-family="-apple-system,sans-serif" font-size="14" font-weight="500" fill="#FAFAFA">TNB</text>
