  <rect x="148" y="12" width="94" height="34" rx="17" fill="#0A0A0B"/>
  <text x="330" y="56" font-family="-apple-system,sans-serif" font-size="13" fill="#FAFAFA">●●●</text>

  <!-- Greeting -->
