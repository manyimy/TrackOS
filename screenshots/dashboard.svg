<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B6FF3D"/>
      <stop offset="100%" style="stop-color:#8FD400"/>
    </linearGradient>
  </defs>

  <!-- Phone body -->
  <rect width="390" height="844" rx="44" fill="#0A0A0B"/>
