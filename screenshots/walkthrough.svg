    <!-- breakdown rows -->
    <rect x="18" y="276" width="244" height="180" rx="12" fill="#111114" stroke="#26262C"/>
    <circle cx="38" cy="304" r="10" fill="#FF9500" opacity="0.2"/>
    <text x="38" y="308" font-size="9" fill="#FF9500" text-anchor="middle">🍔</text>
    <text x="56" y="302" font-size="11" fill="#FAFAFA">Food &amp; Dining</text>
    <text x="252" y="302" font-size="11" font-weight="600" fill="#FAFAFA" text-anchor="end">RM 942</text>
    <rect x="56" y="310" width="196" height="3" rx="1.5" fill="#26262C"/>
    <rect x="56" y="310" width="120" height="3" rx="1.5" fill="#FF9500"/>

    <circle cx="38" cy="346" r="10" fill="#007AFF" opacity="0.2"/>
    <text x="38" y="350" font-size="9" fill="#007AFF" text-anchor="middle">🚗</text>
    <text x="56" y="344" font-size="11" fill="#FAFAFA">Transportation</text>
    <text x="252" y="344" font-size="11" font-weight="600" fill="#FAFAFA" text-anchor="end">RM 612</text>
    <rect x="56" y="352" width="196" height="3" rx="1.5" fill="#26262C"/>
    <rect x="56" y="352" width="78" height="3" rx="1.5" fill="#007AFF"/>

    <circle cx="38" cy="388" r="10" fill="#AF52DE" opacity="0.2"/>
    <text x="38" y="392" font-size="9" fill="#AF52DE" text-anchor="middle">🛍</text>
    <text x="56" y="386" font-size="11" fill="#FAFAFA">Shopping</text>
    <text x="252" y="386" font-size="11" font-weight="600" fill="#FAFAFA" text-anchor="end">RM 488</text>
    <rect x="56" y="394" width="196" height="3" rx="1.5" fill="#26262C"/>
    <rect x="56" y="394" width="62" height="3" rx="1.5" fill="#AF52DE"/>

    <circle cx="38" cy="430" r="10" fill="#FF3B30" opacity="0.2"/>
    <text x="38" y="434" font-size="9" fill="#FF3B30" text-anchor="middle">⚡</text>
    <text x="56" y="428" font-size="11" fill="#FAFAFA">Utilities</text>
    <text x="252" y="428" font-size="11" font-weight="600" fill="#FAFAFA" text-anchor="end">RM 246</text>
    <rect x="56" y="436" width="196" height="3" rx="1.5" fill="#26262C"/>
    <rect x="56" y="436" width="32" height="3" rx="1.5" fill="#FF3B30"/>

    <text x="140" y="660" font-size="11" fill="#A1A1AA" text-anchor="middle">Daily trends · Category breakdown</text>
    <text x="140" y="678" font-size="11" fill="#A1A1AA" text-anchor="middle">Smart spending tips</text>
  </g>

  <!-- Arrow 3→4 -->
  <g transform="translate(1130,400)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#B6FF3D" stroke-width="2"/>
    <polygon points="60,-6 72,0 60,6" fill="#B6FF3D"/>
    <animateTransform attributeName="transform" type="translate" values="1130,400;1140,400;1130,400" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
  </g>

  <!-- ===== Screen 4: Budgets ===== -->
  <g transform="translate(1240,110)">
    <text x="100" y="-12" font-size="11" font-weight="600" fill="#B6FF3D">STEP 4</text>
    <text x="100" y="6" font-size="14" font-weight="600" fill="#FAFAFA">Track Budgets</text>
    <rect x="0" y="20" width="280" height="608" rx="32" fill="#0A0A0B" stroke="#26262C" stroke-width="1.5"/>
    <text x="20" y="58" font-size="18" font-weight="700" fill="#FAFAFA">Budgets</text>
    <!-- ring 1 -->
    <g transform="translate(60,116)">
      <circle r="36" fill="none" stroke="#26262C" stroke-width="6"/>
      <circle r="36" fill="none" stroke="#B6FF3D" stroke-width="6" stroke-dasharray="170 226" stroke-dashoffset="0" transform="rotate(-90)"/>
      <text y="-4" font-size="14" font-weight="700" fill="#FAFAFA" text-anchor="middle">75%</text>
      <text y="14" font-size="9" fill="#A1A1AA" text-anchor="middle">Monthly</text>
    </g>
    <text x="60" y="180" font-size="10" font-weight="600" fill="#FAFAFA" text-anchor="middle">RM 2,250 / 3,000</text>
    <!-- ring 2 -->
    <g transform="translate(220,116)">
      <circle r="36" fill="none" stroke="#26262C" stroke-width="6"/>
      <circle r="36" fill="none" stroke="#FF3B30" stroke-width="6" stroke-dasharray="220 226" stroke-dashoffset="0" transform="rotate(-90)"/>
      <text y="-4" font-size="14" font-weight="700" fill="#FAFAFA" text-anchor="middle">98%</text>
      <text y="14" font-size="9" fill="#FF3B30" text-anchor="middle">Food</text>
    </g>
    <text x="220" y="180" font-size="10" font-weight="600" fill="#FAFAFA" text-anchor="middle">RM 588 / 600</text>

    <!-- budget rows -->
