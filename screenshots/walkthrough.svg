    <rect x="0" y="20" width="280" height="608" rx="32" fill="#0A0A0B" stroke="#26262C" stroke-width="1.5"/>
    <text x="20" y="58" font-size="18" font-weight="700" fill="#FAFAFA">Insights</text>
    <!-- chart -->
    <rect x="18" y="80" width="244" height="160" rx="12" fill="#111114" stroke="#26262C"/>
    <text x="34" y="104" font-size="10" fill="#A1A1AA">Daily Spending</text>
    <text x="34" y="128" font-size="20" font-weight="700" fill="#FAFAFA">RM 94.92/day</text>
    <!-- bars -->
    <g transform="translate(30,148)">
      <rect x="0"   y="42" width="14" height="38" rx="3" fill="#B6FF3D" opacity="0.5"/>
      <rect x="20"  y="22" width="14" height="58" rx="3" fill="#B6FF3D" opacity="0.6"/>
      <rect x="40"  y="34" width="14" height="46" rx="3" fill="#B6FF3D" opacity="0.55"/>
      <rect x="60"  y="10" width="14" height="70" rx="3" fill="#B6FF3D"/>
      <rect x="80"  y="28" width="14" height="52" rx="3" fill="#B6FF3D" opacity="0.6"/>
      <rect x="100" y="38" width="14" height="42" rx="3" fill="#B6FF3D" opacity="0.5"/>
      <rect x="120" y="20" width="14" height="60" rx="3" fill="#B6FF3D" opacity="0.7"/>
      <rect x="140" y="46" width="14" height="34" rx="3" fill="#B6FF3D" opacity="0.45"/>
      <rect x="160" y="14" width="14" height="66" rx="3" fill="#B6FF3D" opacity="0.85"/>
      <rect x="180" y="32" width="14" height="48" rx="3" fill="#B6FF3D" opacity="0.55"/>
      <rect x="200" y="24" width="14" height="56" rx="3" fill="#B6FF3D" opacity="0.65"/>
    </g>
    <!-- breakdown title -->
