    <rect x="18" y="228" width="244" height="68" rx="12" fill="#111114" stroke="#26262C"/>
    <circle cx="40" cy="262" r="14" fill="#FF9500" opacity="0.18"/>
    <text x="40" y="267" font-size="12" fill="#FF9500" text-anchor="middle">🍔</text>
    <text x="64" y="252" font-size="12" font-weight="600" fill="#FAFAFA">Food &amp; Dining</text>
    <text x="64" y="266" font-size="10" fill="#A1A1AA">RM 588 of RM 600</text>
    <rect x="64" y="276" width="180" height="4" rx="2" fill="#26262C"/>
    <rect x="64" y="276" width="176" height="4" rx="2" fill="#FF3B30"/>

    <rect x="18" y="306" width="244" height="68" rx="12" fill="#111114" stroke="#26262C"/>
    <circle cx="40" cy="340" r="14" fill="#007AFF" opacity="0.18"/>
    <text x="40" y="345" font-size="12" fill="#007AFF" text-anchor="middle">🚗</text>
    <text x="64" y="330" font-size="12" font-weight="600" fill="#FAFAFA">Transportation</text>
    <text x="64" y="344" font-size="10" fill="#A1A1AA">RM 612 of RM 800</text>
    <rect x="64" y="354" width="180" height="4" rx="2" fill="#26262C"/>
    <rect x="64" y="354" width="138" height="4" rx="2" fill="#B6FF3D"/>

    <rect x="18" y="384" width="244" height="68" rx="12" fill="#111114" stroke="#26262C"/>
    <circle cx="40" cy="418" r="14" fill="#AF52DE" opacity="0.18"/>
    <text x="40" y="423" font-size="12" fill="#AF52DE" text-anchor="middle">🛍</text>
    <text x="64" y="408" font-size="12" font-weight="600" fill="#FAFAFA">Shopping</text>
    <text x="64" y="422" font-size="10" fill="#A1A1AA">RM 488 of RM 1,000</text>
    <rect x="64" y="432" width="180" height="4" rx="2" fill="#26262C"/>
    <rect x="64" y="432" width="88" height="4" rx="2" fill="#B6FF3D"/>

    <text x="140" y="660" font-size="11" fill="#A1A1AA" text-anchor="middle">Visual rings · Per-category limits</text>
    <text x="140" y="678" font-size="11" fill="#A1A1AA" text-anchor="middle">Color cues for over-budget</text>
