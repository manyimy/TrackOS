<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="900" viewBox="0 0 1640 900" font-family="-apple-system,sans-serif">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B6FF3D"/>
      <stop offset="100%" style="stop-color:#8FD400"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0B"/>
      <stop offset="100%" style="stop-color:#15151B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1640" height="900" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="820" y="50" font-size="22" font-weight="700" fill="#FAFAFA" text-anchor="middle">TrackOS — Sample User Walkthrough</text>
  <text x="820" y="76" font-size="13" fill="#A1A1AA" text-anchor="middle">Dashboard → Add Expense → Insights → Budgets</text>

  <!-- ===== Screen 1: Dashboard ===== -->
  <g transform="translate(40,110)">
    <text x="100" y="-12" font-size="11" font-weight="600" fill="#B6FF3D">STEP 1</text>
    <text x="100" y="6" font-size="14" font-weight="600" fill="#FAFAFA">Open Dashboard</text>
    <!-- phone -->
    <rect x="0" y="20" width="280" height="608" rx="32" fill="#0A0A0B" stroke="#26262C" stroke-width="1.5"/>
    <!-- balance card -->
    <rect x="18" y="60" width="244" height="116" rx="14" fill="url(#cardGrad)"/>
    <text x="34" y="86" font-size="9" font-weight="500" fill="#0A0A0B" opacity="0.7">Total Spent</text>
    <text x="34" y="128" font-size="26" font-weight="900" fill="#0A0A0B">RM 2,847</text>
    <text x="34" y="150" font-size="10" fill="#0A0A0B" opacity="0.6">This month</text>
    <!-- period picker -->
    <rect x="18" y="190" width="244" height="28" rx="8" fill="#232329"/>
    <rect x="98" y="192" width="80" height="24" rx="7" fill="#18181D"/>
    <text x="58"  y="207" font-size="10" fill="#6B6B73" text-anchor="middle">Week</text>
    <text x="138" y="207" font-size="10" fill="#FAFAFA" font-weight="500" text-anchor="middle">Month</text>
    <text x="220" y="207" font-size="10" fill="#6B6B73" text-anchor="middle">Year</text>
    <!-- recent header -->
    <text x="20" y="248" font-size="12" font-weight="700" fill="#FAFAFA">Recent</text>
    <!-- recent rows -->
    <rect x="18" y="258" width="244" height="200" rx="12" fill="#111114" stroke="#26262C" stroke-width="0.8"/>
    <circle cx="38" cy="284" r="11" fill="#FF9500" opacity="0.18"/>
    <text x="38" y="288" font-size="10" fill="#FF9500" text-anchor="middle">🍔</text>
    <text x="56" y="282" font-size="11" fill="#FAFAFA">McDonald's</text>
    <text x="56" y="294" font-size="9" fill="#A1A1AA">Today</text>
    <text x="252" y="288" font-size="11" fill="#FAFAFA" text-anchor="end">RM 23.90</text>
    <line x1="56" y1="306" x2="254" y2="306" stroke="#26262C" stroke-width="0.4"/>
    <circle cx="38" cy="328" r="11" fill="#007AFF" opacity="0.18"/>
    <text x="38" y="332" font-size="10" fill="#007AFF" text-anchor="middle">🚗</text>
    <text x="56" y="326" font-size="11" fill="#FAFAFA">Grab</text>
    <text x="56" y="338" font-size="9" fill="#A1A1AA">Today</text>
    <text x="252" y="332" font-size="11" fill="#FAFAFA" text-anchor="end">RM 18.50</text>
    <line x1="56" y1="350" x2="254" y2="350" stroke="#26262C" stroke-width="0.4"/>
    <circle cx="38" cy="372" r="11" fill="#AF52DE" opacity="0.18"/>
    <text x="38" y="376" font-size="10" fill="#AF52DE" text-anchor="middle">🛍</text>
    <text x="56" y="370" font-size="11" fill="#FAFAFA">Shopee</text>
    <text x="56" y="382" font-size="9" fill="#A1A1AA">Yesterday</text>
    <text x="252" y="376" font-size="11" fill="#FAFAFA" text-anchor="end">RM 156.00</text>
    <line x1="56" y1="394" x2="254" y2="394" stroke="#26262C" stroke-width="0.4"/>
    <circle cx="38" cy="416" r="11" fill="#FF9500" opacity="0.18"/>
    <text x="38" y="420" font-size="10" fill="#FF9500" text-anchor="middle">☕</text>
    <text x="56" y="414" font-size="11" fill="#FAFAFA">Starbucks</text>
    <text x="56" y="426" font-size="9" fill="#A1A1AA">Yesterday</text>
    <text x="252" y="420" font-size="11" fill="#FAFAFA" text-anchor="end">RM 22.00</text>
    <!-- FAB pulses -->
    <circle cx="234" cy="484" r="22" fill="#B6FF3D" filter="url(#glow)">
      <animate attributeName="r" values="22;26;22" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="234" y="491" font-size="20" font-weight="700" fill="#0A0A0B" text-anchor="middle">+</text>
    <!-- tab bar -->
    <rect x="0" y="568" width="280" height="40" fill="#111114"/>
    <text x="46"  y="592" font-size="9" font-weight="600" fill="#B6FF3D" text-anchor="middle">Dashboard</text>
    <text x="140" y="592" font-size="9" fill="#6B6B73" text-anchor="middle">Insights</text>
    <text x="234" y="592" font-size="9" fill="#6B6B73" text-anchor="middle">Budgets</text>
    <!-- caption -->
    <text x="140" y="660" font-size="11" fill="#A1A1AA" text-anchor="middle">Greeting · Total spent · Recent activity</text>
    <text x="140" y="678" font-size="11" fill="#A1A1AA" text-anchor="middle">Tap the green “+” to log an expense</text>
  </g>

  <!-- Arrow 1→2 -->
  <g transform="translate(330,400)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#B6FF3D" stroke-width="2"/>
    <polygon points="60,-6 72,0 60,6" fill="#B6FF3D"/>
    <animateTransform attributeName="transform" type="translate" values="330,400;340,400;330,400" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- ===== Screen 2: Add Expense ===== -->
  <g transform="translate(440,110)">
    <text x="100" y="-12" font-size="11" font-weight="600" fill="#B6FF3D">STEP 2</text>
    <text x="100" y="6" font-size="14" font-weight="600" fill="#FAFAFA">Log an Expense</text>
    <rect x="0" y="20" width="280" height="608" rx="32" fill="#0A0A0B" stroke="#26262C" stroke-width="1.5"/>
    <text x="20" y="58" font-size="13" font-weight="600" fill="#FAFAFA">Add Expense</text>
    <text x="262" y="58" font-size="11" fill="#6B6B73" text-anchor="end">Cancel</text>
    <text x="20" y="92" font-size="9" font-weight="500" fill="#A1A1AA">AMOUNT</text>
    <rect x="20" y="100" width="40" height="40" rx="8" fill="#18181D" stroke="#26262C"/>
    <text x="40" y="125" font-size="13" fill="#FAFAFA" text-anchor="middle">RM</text>
    <text x="72" y="132" font-size="32" font-weight="700" fill="#FAFAFA">23.90</text>
    <text x="20" y="172" font-size="9" font-weight="500" fill="#A1A1AA">MERCHANT</text>
    <rect x="20" y="180" width="240" height="40" rx="8" fill="#18181D" stroke="#26262C"/>
    <text x="32" y="205" font-size="12" fill="#FAFAFA">McDonald's</text>
    <text x="20" y="240" font-size="9" font-weight="500" fill="#A1A1AA">DATE</text>
    <rect x="20" y="248" width="240" height="40" rx="8" fill="#18181D" stroke="#26262C"/>
    <text x="32" y="273" font-size="12" fill="#FAFAFA">Today, 12:34 PM</text>
    <text x="20" y="308" font-size="9" font-weight="500" fill="#A1A1AA">CATEGORY</text>
    <g transform="translate(20,318)">
      <rect width="64" height="30" rx="15" fill="#B6FF3D"/>
      <text x="32" y="20" font-size="10" font-weight="600" fill="#0A0A0B" text-anchor="middle">🍔 Food</text>
      <rect x="72" width="74" height="30" rx="15" fill="#18181D" stroke="#26262C"/>
      <text x="109" y="20" font-size="10" fill="#A1A1AA" text-anchor="middle">🚗 Transport</text>
      <rect x="154" width="60" height="30" rx="15" fill="#18181D" stroke="#26262C"/>
      <text x="184" y="20" font-size="10" fill="#A1A1AA" text-anchor="middle">🛍 Shop</text>
    </g>
    <text x="20" y="378" font-size="9" font-weight="500" fill="#A1A1AA">NOTE (OPTIONAL)</text>
    <rect x="20" y="386" width="240" height="40" rx="8" fill="#18181D" stroke="#26262C"/>
    <text x="32" y="411" font-size="12" fill="#6B6B73">Add a note</text>
    <!-- save button -->
    <rect x="20" y="492" width="240" height="46" rx="12" fill="#B6FF3D" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.7;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="140" y="520" font-size="14" font-weight="700" fill="#0A0A0B" text-anchor="middle">Save</text>
    <text x="140" y="660" font-size="11" fill="#A1A1AA" text-anchor="middle">Auto-categorized · Smart parsing</text>
    <text x="140" y="678" font-size="11" fill="#A1A1AA" text-anchor="middle">Save in one tap</text>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(730,400)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#B6FF3D" stroke-width="2"/>
    <polygon points="60,-6 72,0 60,6" fill="#B6FF3D"/>
    <animateTransform attributeName="transform" type="translate" values="730,400;740,400;730,400" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
  </g>

