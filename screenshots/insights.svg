  <rect x="92"  y="258" width="36" height="92" rx="6" fill="#18181D"/>
  <rect x="140" y="300" width="36" height="50" rx="6" fill="#18181D"/>
  <rect x="188" y="240" width="36" height="110" rx="6" fill="#18181D"/>
