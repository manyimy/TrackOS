  <text x="254" y="362" font-family="-apple-system,sans-serif" font-size="10" fill="#6B6B73" text-anchor="middle">F</text>
  <text x="302" y="362" font-family="-apple-system,sans-serif" font-size="10" fill="#6B6B73" text-anchor="middle">S</text>
  <text x="350" y="362" font-family="-apple-system,sans-serif" font-size="10" fill="#B6FF3D" text-anchor="middle">S</text>

