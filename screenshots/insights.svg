<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <!-- Phone body -->
  <rect width="390" height="844" rx="44" fill="#0A0A0B"/>
  <rect x="1" y="1" width="388" height="842" rx="43" fill="none" stroke="#26262C" stroke-width="1.5"/>

