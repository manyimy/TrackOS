  <line x1="0" y1="786" x2="390" y2="786" stroke="#26262C" stroke-width="0.5"/>
  <text x="60"  y="822" font-family="-apple-system,sans-serif" font-size="10" fill="#6B6B73" text-anchor="middle">Dashboard</text>
