  <text x="60"  y="810" font-family="-apple-system,sans-serif" font-size="18" fill="#6B6B73" text-anchor="middle">⌂</text>
  <text x="195" y="810" font-family="-apple-system,sans-serif" font-size="18" fill="#B6FF3D" text-anchor="middle">▦</text>
  <text x="330" y="810" font-family="-apple-system,sans-serif" font-size="18" fill="#6B6B73" text-anchor="middle">◎</text>

  <rect x="155" y="832" width="80" height="5" rx="2.5" fill="#FAFAFA" opacity="0.3"/>
