<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 610" width="260" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif">
  <defs>
    <clipPath id="rs-clip"><rect x="8" y="8" width="284" height="594" rx="38"/></clipPath>
  </defs>

  <rect width="300" height="610" rx="44" fill="#1C1C1E"/>
  <rect x="8" y="8" width="284" height="594" rx="38" fill="#F0F7FF" clip-path="url(#rs-clip)"/>
  <rect x="105" y="18" width="90" height="28" rx="14" fill="#1C1C1E"/>
  <text x="28" y="38" font-size="13" font-weight="600" fill="#0F172A">9:41</text>

  <!-- Nav -->
  <text x="150" y="82" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">Scan Receipt</text>

  <!-- Hero: concentric circles in pale blue -->
  <circle cx="150" cy="238" r="94" fill="#DBEAFE" fill-opacity="0.45"/>
  <circle cx="150" cy="238" r="64" fill="#DBEAFE"/>

  <!-- Viewfinder corners -->
  <polyline points="120,206 120,194 132,194" stroke="#2563EB" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="168,194 180,194 180,206" stroke="#2563EB" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="120,270 120,282 132,282" stroke="#2563EB" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="168,282 180,282 180,270" stroke="#2563EB" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Receipt lines -->
  <line x1="135" y1="224" x2="165" y2="224" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="135" y1="238" x2="165" y2="238" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="135" y1="252" x2="155" y2="252" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Text -->
  <text x="150" y="318" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Scan a Receipt</text>
  <text x="150" y="340" font-size="12" fill="#64748B" text-anchor="middle">Pick a photo — Vision OCR will extract</text>
  <text x="150" y="356" font-size="12" fill="#64748B" text-anchor="middle">merchant, amount and date.</text>

  <!-- CTA button -->
  <rect x="32" y="378" width="236" height="48" rx="16" fill="#2563EB" filter="drop-shadow(0 5px 10px rgba(37,99,235,0.32))"/>
  <text x="150" y="407" font-size="14" font-weight="600" fill="white" text-anchor="middle">Choose from Library</text>

  <!-- Tip card -->
  <rect x="20" y="448" width="260" height="36" rx="12" fill="white"/>
  <text x="34" y="470" font-size="12" fill="#F59E0B">💡</text>
  <text x="52" y="470" font-size="10" fill="#64748B">Flat receipts in good lighting work best</text>

  <!-- Tab Bar -->
  <rect x="8" y="562" width="284" height="40" fill="white"/>
  <line x1="8" y1="562" x2="292" y2="562" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="54" y="577" font-size="10" fill="#94A3B8" text-anchor="middle">◼</text>
  <text x="54" y="589" font-size="9" fill="#94A3B8" text-anchor="middle">Dashboard</text>
  <text x="114" y="577" font-size="10" fill="#94A3B8" text-anchor="middle">≡</text>
  <text x="114" y="589" font-size="9" fill="#94A3B8" text-anchor="middle">Expenses</text>
  <text x="174" y="577" font-size="10" fill="#2563EB" text-anchor="middle">⬚</text>
  <text x="174" y="589" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="600">Scanner</text>
  <text x="234" y="577" font-size="10" fill="#94A3B8" text-anchor="middle">🔔</text>
  <text x="234" y="589" font-size="9" fill="#94A3B8" text-anchor="middle">Inbox</text>
</svg>
