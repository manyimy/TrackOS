    <text x="258" y="104" font-family="-apple-system,sans-serif" font-size="13" fill="#007AFF">Paste</text>

    <!-- Content -->
    <rect x="8" y="136" width="284" height="380" fill="#F2F2F7"/>

    <!-- Pending card 1: Grab -->
    <rect x="16" y="144" width="268" height="126" rx="16" fill="white"/>
    <!-- Header row -->
    <rect x="30" y="158" width="20" height="20" rx="6" fill="#EFF6FF"/>
    <rect x="33" y="164" width="14" height="8" rx="2" fill="#3B82F6"/>
    <circle cx="37" cy="173" r="2.5" fill="#3B82F6"/>
    <circle cx="44" cy="173" r="2.5" fill="#3B82F6"/>
    <text x="58" y="172" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="600" fill="#000">Grab</text>
    <text x="270" y="172" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#000" text-anchor="end">RM 14.00</text>
