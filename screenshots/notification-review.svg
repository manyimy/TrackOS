    <text x="150" y="438" font-family="-apple-system,sans-serif" font-size="13" fill="#8E8E93" text-anchor="middle">Paste notification text…</text>
    <text x="150" y="455" font-family="-apple-system,sans-serif" font-size="11" fill="#007AFF" text-anchor="middle">or use trackos://expense?text=</text>

    <!-- Tab bar -->
    <rect x="8" y="516" width="284" height="86" fill="white"/>
    <line x1="8" y1="516" x2="292" y2="516" stroke="#E5E5EA" stroke-width="0.5"/>
