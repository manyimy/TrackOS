    <rect x="16" y="280" width="268" height="126" rx="16" fill="white"/>
    <rect x="30" y="294" width="20" height="20" rx="6" fill="#FFF7ED"/>
    <rect x="37" y="300" width="6" height="10" rx="3" fill="#F97316"/>
    <rect x="32" y="305" width="16" height="3" rx="1" fill="#F97316"/>
