    <rect x="178" y="525" width="16" height="18" rx="4" fill="none" stroke="#8E8E93" stroke-width="1.5"/>
    <rect x="181" y="529" width="10" height="2" rx="0.5" fill="#8E8E93"/>
    <rect x="181" y="533" width="10" height="2" rx="0.5" fill="#8E8E93"/>
    <rect x="181" y="537" width="6" height="2" rx="0.5" fill="#8E8E93"/>
    <text x="186" y="557" font-family="-apple-system,sans-serif" font-size="10" fill="#8E8E93" text-anchor="middle">Scan</text>
    <!-- Notifications (active + badge) -->
    <circle cx="251" cy="535" r="12" fill="#EBF5FF"/>
    <path d="M249 526 C249 526 244 526 244 531 L244 537 L257 537 L257 531 C257 526 252 526 252 526 Z" fill="none" stroke="#007AFF" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="247" y="537" width="9" height="2" rx="1" fill="#007AFF"/>
    <!-- Badge -->
    <circle cx="260" cy="522" r="7" fill="#FF3B30"/>
    <text x="260" y="526" font-family="-apple-system,sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">2</text>
    <text x="251" y="557" font-family="-apple-system,sans-serif" font-size="10" fill="#007AFF" text-anchor="middle">Notifications</text>

    <!-- Home indicator -->
    <rect x="112" y="591" width="76" height="4" rx="2" fill="#000" opacity="0.2"/>
