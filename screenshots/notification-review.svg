    <text x="44" y="557" font-family="-apple-system,sans-serif" font-size="10" fill="#8E8E93" text-anchor="middle">Dashboard</text>
    <!-- Expenses -->
    <rect x="107" y="526" width="16" height="2" rx="1" fill="#8E8E93"/>
    <rect x="107" y="531" width="16" height="2" rx="1" fill="#8E8E93"/>
    <rect x="107" y="536" width="10" height="2" rx="1" fill="#8E8E93"/>
    <text x="115" y="557" font-family="-apple-system,sans-serif" font-size="10" fill="#8E8E93" text-anchor="middle">Expenses</text>
