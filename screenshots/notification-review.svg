    <text x="68" y="196" font-family="-apple-system,sans-serif" font-size="11" fill="#3B82F6" text-anchor="middle">Transportation</text>
    <text x="270" y="196" font-family="-apple-system,sans-serif" font-size="11" fill="#8E8E93" text-anchor="end">Apr 25</text>
