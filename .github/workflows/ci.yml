name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Unit tests (Foundation-only, no simulator needed) ───────────────────────
  test:
    name: Unit Tests
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test --filter TrackOSTests

  # ── iOS compilation check (catches SwiftUI / SwiftData errors) ──────────────
  # Mac Catalyst is used because the iOS platform SDK is not pre-installed on
  # the runner. Catalyst compiles #if os(iOS) code paths identically to iOS
  # and is always available alongside the macOS SDK in Xcode.
  build-ios:
    name: iOS Build Check
    runs-on: macos-15
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build TrackOS for Mac Catalyst
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme TrackOS \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            2>&1 | xcpretty --color
