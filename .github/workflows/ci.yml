name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Unit tests (Foundation-only, no simulator needed) ───────────────────────
  test:
    name: Unit Tests
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Swift version
        run: swift --version

      - name: Build TrackOSCore
        run: swift build --target TrackOSCore

      - name: Run TrackOSTests
        run: swift test --filter TrackOSTests

  # ── iOS compilation check (catches SwiftUI / SwiftData errors) ──────────────
  build-ios:
    name: iOS Build Check
    runs-on: macos-15
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -scheme TrackOS

      - name: Build TrackOS for iOS Simulator
        run: |
          xcodebuild build \
            -scheme TrackOS \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO
