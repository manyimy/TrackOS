name: iOS CI

on:
  push:
    branches: ["**"]
    paths:
      - "iOS/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "iOS/**"
      - ".github/workflows/ios-ci.yml"

defaults:
  run:
    working-directory: iOS

jobs:
  # ── Unit tests (Domain + Persistence + FeatureAddExpense) ───────────────────
  test:
    name: Unit Tests
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Swift version
        run: swift --version

      - name: Run Domain tests
        run: swift test --filter DomainTests

      - name: Run FeatureAddExpense tests
        run: swift test --filter FeatureAddExpenseTests

      - name: Run Persistence tests
        run: swift test --filter PersistenceTests

  # ── iOS compilation check (catches SwiftUI / SwiftData errors) ──────────────
  # Mac Catalyst is used because the iOS platform SDK is not pre-installed on
  # the runner. Catalyst compiles #if os(iOS) && !targetEnvironment(macCatalyst)
  # guards correctly — they compile on iOS and skip on Catalyst.
  build-ios:
    name: iOS Build Check
    runs-on: macos-15
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: List available schemes (debug)
        run: xcodebuild -list

      - name: Build all SPM targets via Mac Catalyst (umbrella = AppShell)
        run: |
          xcodebuild build \
            -scheme AppShell \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            -quiet
